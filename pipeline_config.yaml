# Fresh CF Pipeline Configuration
# YAML configuration for the counterfactual generation pipeline

pipeline:
  n_iterations: 100  # Number of times to generate fresh CFs
  n_patients: 48     # Debug cap used only in test mode; full mode uses test-set true-positive cohort
  n_workers: 4       # Number of concurrent workers (adjust based on CPU cores)
  test_mode: false   # Set to true for quick testing (5 patients, 5 iterations)
  run_patient_bootstrap: false
  bootstrap_iterations: 1000

dice:
  model_path: "model/xgb_pipeline.pkl"
  data_path: "data/heart_statlog_cleveland_hungary_final.csv"
  method: "genetic"
  total_cfs: 5
  features_to_vary: null   # Unconstrained DiCE search; only chol is range-constrained (see permitted_range). chol-only projection is at the SCM step.
  search_params:
    maxiterations: 500
    thresh: 0.01
    proximity_weight: 0.5
    sparsity_weight: 1.0
    diversity_weight: 5.0
    stopping_threshold: 0.5
    posthoc_sparsity_algorithm: "binary"
    posthoc_sparsity_param: 0.1
  permitted_range:
    chol: [150, 200]   # Cholesterol-only intervention corridor
  # The genetic search is bounded by search_params.maxiterations /
  # stopping_threshold above. There is no wall-clock timeout.
  # DiCE 0.11's genetic explainer has no random_seed argument; it draws from BOTH
  # global RNGs (NumPy and stdlib random) -- seeding NumPy alone silently does
  # nothing. Seed them deterministically per (iteration, patient) so the
  # whole 100-iteration ensemble is reproducible while run-to-run variation --
  # what the algorithmic-stability intervals measure -- is preserved.
  # Set false to reproduce the legacy unseeded behaviour.
  deterministic_seeding: true
  seed_base: 42

scm:
  n_samples: 1000  # SCM Monte Carlo samples per intervention
  graph_structure: "full"
  # Intervention is always do(chol) only — trestbps and other downstream
  # variables are propagated through the structural equations, not clamped.
  fit_seed: 42  # Must match the artifact built by train_scm.py --fit-seed
  model_dir: "model"            # Where train_scm.py writes scm_<variant>.pkl

output:
  base_dir: "fresh_cf_iterations"
  keep_all_iterations: false  # Set true to keep all CF files (uses more disk space)

ci:
  confidence_level: 0.95  # 95% confidence intervals

sensitivity:
  n_iterations: 10       # Iterations per variant (reduced for speed)
  n_patients: 10         # Patients per variant
  parameters:            # Parameter grid for OAT sensitivity sweeps
    total_cfs: [3, 5, 7, 10]
    chol_lower: [100, 150, 200]
    confidence_level: [0.90, 0.95, 0.99]  # Post-hoc recomputation only
    graph_structure: ["minimal", "full", "extended"]
